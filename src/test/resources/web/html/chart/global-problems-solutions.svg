<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" width="640" height="580" role="img" aria-label="Scatter plot of solutions: potential gain versus initial effort">
    <style>
        :root { --bg: #fbfaf7; --fg: #1d1d1b; --muted: #77756f; --grid: #e3e0d8; --accent: #c4561c; --accent2: #2d6a8a; }
        @media (prefers-color-scheme: dark) {
        :root { --bg: #1b1b1a; --fg: #ecebe6; --muted: #9a978f; --grid: #353431; --accent: #f08a4b; --accent2: #4f93b8; }
        }
        svg { font-family: system-ui, sans-serif; }
        .bg { fill: var(--bg); }
        .h { fill: var(--fg); font-size: 18px; font-weight: 600; }
        .sub { fill: var(--muted); font-size: 12px; }
        .grid { stroke: var(--grid); stroke-width: 1; }
        .ax { fill: var(--muted); font-size: 12px; }
        .pt circle { fill: var(--accent2); }
        .pt text { fill: #fff; font-size: 11px; font-weight: 600; text-anchor: middle; }
        .pt:hover circle { fill: var(--accent); }
        .lg { fill: var(--fg); font-size: 12px; }
        .lg tspan.p { fill: var(--muted); }
        .lg tspan.n { font-weight: 600; fill: var(--accent2); }
    </style>
    <rect class="bg" width="640" height="580"/>
    <text class="h" x="20" y="24">Solutions: potential gain vs. initial effort</text>
    <text class="sub" x="20" y="42">Assumed values (a), point estimates · hover a point for ranges and loss reduction</text>

    <g transform="translate(0 36)">
        <!-- x: 0..22 person years → 60..620 · y: 0..40 billion htp → 330..20 -->
        <g class="grid">
            <line x1="60" y1="330" x2="620" y2="330"/>
            <line x1="60" y1="252.5" x2="620" y2="252.5"/>
            <line x1="60" y1="175" x2="620" y2="175"/>
            <line x1="60" y1="97.5" x2="620" y2="97.5"/>
            <line x1="60" y1="20" x2="620" y2="20"/>
            <line x1="60" y1="20" x2="60" y2="330"/>
            <line x1="187.3" y1="20" x2="187.3" y2="330"/>
            <line x1="314.5" y1="20" x2="314.5" y2="330"/>
            <line x1="441.8" y1="20" x2="441.8" y2="330"/>
            <line x1="569.1" y1="20" x2="569.1" y2="330"/>
        </g>
        <g class="ax">
            <text x="52" y="334" text-anchor="end">0</text>
            <text x="52" y="256.5" text-anchor="end">10</text>
            <text x="52" y="179" text-anchor="end">20</text>
            <text x="52" y="101.5" text-anchor="end">30</text>
            <text x="52" y="24" text-anchor="end">40</text>
            <text x="60" y="350" text-anchor="middle">0</text>
            <text x="187.3" y="350" text-anchor="middle">5</text>
            <text x="314.5" y="350" text-anchor="middle">10</text>
            <text x="441.8" y="350" text-anchor="middle">15</text>
            <text x="569.1" y="350" text-anchor="middle">20</text>
            <text x="340" y="370" text-anchor="middle">initial effort in person years</text>
            <text x="16" y="175" text-anchor="middle" transform="rotate(-90 16 175)">potential gain in billion htp</text>
        </g>

        <g class="pt"><title>1 reduce climate gas emissions (global warming)
            gain: 35.2a bn htp (23.47 – 52.8)
            effort: 3a py (1.2 – 7.5)
            loss reduction: 8%a (3.2% – 20%)</title><circle cx="136.4" cy="57.2" r="11"/><text x="136.4" y="61">1</text></g>
        <g class="pt"><title>2 avoid wrong decisions (populism)
            gain: 34.1a bn htp (22.73 – 51.15)
            effort: 8a py (3.2 – 20)
            loss reduction: 100%a (40% – 100%)</title><circle cx="263.6" cy="65.7" r="11"/><text x="263.6" y="69.5">2</text></g>
        <g class="pt"><title>3 research (poverty)
            gain: 34.1a bn htp (22.73 – 51.15)
            effort: 10a py (4 – 25)
            loss reduction: 1%a (0.4% – 2.5%)</title><circle cx="314.5" cy="65.7" r="11"/><text x="314.5" y="69.5">3</text></g>
        <g class="pt"><title>4 public AI (black-box AI)
            gain: 7a bn htp (2.8 – 17.5)
            effort: 20a py (8 – 50)
            loss reduction: 50%a (20% – 100%)</title><circle cx="569.1" cy="275.8" r="11"/><text x="569.1" y="279.6">4</text></g>
        <g class="pt"><title>5 basic income (wealth concentration)
            gain: 16a bn htp (6.4 – 40)
            effort: 5a py (2 – 12.5)
            loss reduction: 30%a (12% – 75%)</title><circle cx="187.3" cy="206" r="11"/><text x="187.3" y="209.8">5</text></g>
        <g class="pt"><title>6 platform regulation (disinformation)
            gain: 12a bn htp (4.8 – 30)
            effort: 12a py (4.8 – 30)
            loss reduction: 10%a (4% – 25%)</title><circle cx="365.5" cy="237" r="11"/><text x="365.5" y="240.8">6</text></g>
        <g class="pt"><title>7 Delphi method (biased information)
            gain: 9a bn htp (3.6 – 22.5)
            effort: 4a py (1.6 – 10)
            loss reduction: 15%a (6% – 37.5%)</title><circle cx="161.8" cy="260.3" r="11"/><text x="161.8" y="264.1">7</text></g>
        <g class="pt"><title>8 spending (education)
            gain: 14.3a bn htp (9.53 – 21.45)
            effort: 6a py (2.4 – 15)
            loss reduction: 5%a (2% – 12.5%)</title><circle cx="212.7" cy="219.2" r="11"/><text x="212.7" y="223">8</text></g>
        <g class="pt"><title>9 market share tax (market power)
            gain: 6a bn htp (2.4 – 15)
            effort: 2a py (0.8 – 5)
            loss reduction: 30%a (12% – 75%)</title><circle cx="110.9" cy="283.5" r="11"/><text x="110.9" y="287.3">9</text></g>
        <g class="pt"><title>10 fluid democracy (citizen participation)
            gain: 5.5a bn htp (2.2 – 13.75)
            effort: 6a py (2.4 – 15)
            loss reduction: 50%a (20% – 100%)</title><circle cx="212.7" cy="287.4" r="11"/><text x="212.7" y="291.2">10</text></g>
        <g class="pt"><title>11 taxes (health)
            gain: 8.8a bn htp (5.87 – 13.2)
            effort: 6a py (2.4 – 15)
            loss reduction: 10%a (4% – 25%)</title><circle cx="212.7" cy="261.8" r="11"/><text x="212.7" y="265.6">11</text></g>
        <g class="pt"><title>12 gross domestic usage (GDP mismeasurement)
            gain: 4a bn htp (1.6 – 10)
            effort: 4a py (1.6 – 10)
            loss reduction: 100%a (40% – 100%)</title><circle cx="161.8" cy="299" r="11"/><text x="161.8" y="302.8">12</text></g>
        <g class="pt"><title>13 free software (proprietary software)
            gain: 3a bn htp (1.2 – 7.5)
            effort: 1a py (0.4 – 2.5)
            loss reduction: 50%a (20% – 100%)</title><circle cx="85.5" cy="306.8" r="11"/><text x="85.5" y="310.6">13</text></g>
    </g>

    <g class="lg">
        <text x="40" y="436"><tspan class="n">1</tspan>  reduce climate gas emissions <tspan class="p">· global warming</tspan></text>
        <text x="40" y="456"><tspan class="n">2</tspan>  avoid wrong decisions <tspan class="p">· populism</tspan></text>
        <text x="40" y="476"><tspan class="n">3</tspan>  research <tspan class="p">· poverty</tspan></text>
        <text x="40" y="496"><tspan class="n">4</tspan>  public AI <tspan class="p">· black-box AI</tspan></text>
        <text x="40" y="516"><tspan class="n">5</tspan>  basic income <tspan class="p">· wealth concentration</tspan></text>
        <text x="40" y="536"><tspan class="n">6</tspan>  platform regulation <tspan class="p">· disinformation</tspan></text>
        <text x="40" y="556"><tspan class="n">7</tspan>  Delphi method <tspan class="p">· biased information</tspan></text>
        <text x="340" y="436"><tspan class="n">8</tspan>  spending <tspan class="p">· education</tspan></text>
        <text x="340" y="456"><tspan class="n">9</tspan>  market share tax <tspan class="p">· market power</tspan></text>
        <text x="340" y="476"><tspan class="n">10</tspan>  fluid democracy <tspan class="p">· citizen participation</tspan></text>
        <text x="340" y="496"><tspan class="n">11</tspan>  taxes <tspan class="p">· health</tspan></text>
        <text x="340" y="516"><tspan class="n">12</tspan>  gross domestic usage <tspan class="p">· GDP mismeasurement</tspan></text>
        <text x="340" y="536"><tspan class="n">13</tspan>  free software <tspan class="p">· proprietary software</tspan></text>
    </g>
</svg>
