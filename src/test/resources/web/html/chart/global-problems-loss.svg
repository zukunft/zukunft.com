<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 470" width="740" height="470" role="img"
     aria-label="Potential loss of global problems in trillion EUR, estimate and range, log scale">
    <style>
        :root { --bg: #fbfaf7; --fg: #1d1d1b; --muted: #77756f; --grid: #e3e0d8; --range: #f0c9a8; --accent: #c4561c;
        --hover: #f4efe6; }
        @media (prefers-color-scheme: dark) {
        :root { --bg: #1b1b1a; --fg: #ecebe6; --muted: #9a978f; --grid: #353431; --range: #6b3d22; --accent: #f08a4b;
        --hover: #262523; }
        }
        svg { font-family: system-ui, sans-serif; }
        .bg { fill: var(--bg); }
        .h { fill: var(--fg); font-size: 18px; font-weight: 600; }
        .sub { fill: var(--muted); font-size: 12px; }
        .grid { stroke: var(--grid); stroke-width: 1; }
        .ax { fill: var(--muted); font-size: 12px; text-anchor: middle; }
        .lbl { fill: var(--fg); font-size: 13px; text-anchor: end; dominant-baseline: central; }
        .val { fill: var(--muted); font-size: 12px; dominant-baseline: central; }
        .rng { fill: var(--range); }
        .mid { fill: var(--accent); }
        .hit { fill: transparent; }
        .row:hover .hit { fill: var(--hover); }
    </style>
    <rect class="bg" width="740" height="470"/>
    <text class="h" x="20" y="24">Global problems: potential loss in trillion EUR</text>
    <text class="sub" x="20" y="42">Assumed values (a): dot = estimate, bar = range · log scale 0.02 – 20 · hover for
        details
    </text>

    <g class="grid">
