<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" role="img" aria-label="Scatter plot: potential loss versus potential gain">

    <style>
        :root { --bg:#fbfaf7; --fg:#1d1d1b; --muted:#77756f; --grid:#e3e0d8; --loss:#c4561c; --gain:#2d6a8a; --dim:#c9c5bb; --hover:#f4efe6; }
        @media (prefers-color-scheme: dark) {
        :root { --bg:#1b1b1a; --fg:#ecebe6; --muted:#9a978f; --grid:#353431; --loss:#f08a4b; --gain:#5fa6cc; --dim:#55534e; --hover:#262523; }
        }
        svg { font-family: system-ui, sans-serif; }
        .bg { fill: var(--bg); }
        .h { fill: var(--fg); font-size: 18px; font-weight: 600; }
        .sub { fill: var(--muted); font-size: 12px; }
        .grid { stroke: var(--grid); stroke-width: 1; }
        .ax { fill: var(--muted); font-size: 12px; }
        .lbl { fill: var(--fg); font-size: 13px; dominant-baseline: central; }
        .val { fill: var(--muted); font-size: 12px; dominant-baseline: central; }
        .loss { fill: var(--loss); }
        .gain { fill: var(--gain); }
        .hit { fill: transparent; }
        .row:hover .hit { fill: var(--hover); }
    </style>
    <rect class="bg" width="640" height="460"/>
    <text class="h" x="20" y="28">Problem size × solution gain</text>
    <text class="sub" x="20" y="47">Assumed values (a) · dashed lines = equal leverage (gain ÷ loss) · hover for details</text>
    <g class="grid">
        <line x1="70.0" y1="80" x2="70.0" y2="400"/>
        <line x1="158.3" y1="80" x2="158.3" y2="400"/>
        <line x1="246.7" y1="80" x2="246.7" y2="400"/>
        <line x1="335.0" y1="80" x2="335.0" y2="400"/>
        <line x1="423.3" y1="80" x2="423.3" y2="400"/>
        <line x1="511.7" y1="80" x2="511.7" y2="400"/>
        <line x1="600.0" y1="80" x2="600.0" y2="400"/>
        <line x1="70" y1="400.0" x2="600" y2="400.0"/>
        <line x1="70" y1="320.0" x2="600" y2="320.0"/>
        <line x1="70" y1="240.0" x2="600" y2="240.0"/>
        <line x1="70" y1="160.0" x2="600" y2="160.0"/>
        <line x1="70" y1="80.0" x2="600" y2="80.0"/>
    </g>
    <rect x="335.0" y="80" width="265.0" height="160.0" style="fill:var(--gain);opacity:0.07"/>
    <rect x="335.0" y="240.0" width="265.0" height="160.0" style="fill:var(--loss);opacity:0.07"/>
    <text class="ax" x="592" y="96" text-anchor="end">big problem · big lever</text>
    <text class="ax" x="592" y="390" text-anchor="end">big problem · weak lever</text>
    <text class="ax" x="78" y="96">small problem · big lever</text>
    <text class="ax" x="78" y="390">small problem · weak lever</text>
    <line x1="70.0" y1="400.0" x2="600.0" y2="304.0" style="stroke:var(--muted);stroke-dasharray:4 4;opacity:0.6"/>
    <text class="ax" x="604.0" y="300.0" style="font-size:11px">×2</text>
    <line x1="70.0" y1="400.0" x2="600.0" y2="160.0" style="stroke:var(--muted);stroke-dasharray:4 4;opacity:0.6"/>
    <text class="ax" x="604.0" y="156.0" style="font-size:11px">×5</text>
    <line x1="70.0" y1="400.0" x2="305.6" y2="80.0" style="stroke:var(--muted);stroke-dasharray:4 4;opacity:0.6"/>
    <text class="ax" x="309.6" y="76.0" style="font-size:11px">×15</text>
    <g class="ax">
        <text x="70.0" y="418" text-anchor="middle">0</text>
        <text x="158.3" y="418" text-anchor="middle">1</text>
        <text x="246.7" y="418" text-anchor="middle">2</text>
        <text x="335.0" y="418" text-anchor="middle">3</text>
        <text x="423.3" y="418" text-anchor="middle">4</text>
        <text x="511.7" y="418" text-anchor="middle">5</text>
        <text x="600.0" y="418" text-anchor="middle">6</text>
        <text x="62" y="404.0" text-anchor="end">0</text>
        <text x="62" y="324.0" text-anchor="end">10</text>
        <text x="62" y="244.0" text-anchor="end">20</text>
        <text x="62" y="164.0" text-anchor="end">30</text>
        <text x="62" y="84.0" text-anchor="end">40</text>
        <text x="335.0" y="440" text-anchor="middle">potential loss in trillion EUR</text>
        <text x="22" y="240.0" text-anchor="middle" transform="rotate(-90 22 240.0)">potential gain in billion htp</text>
    </g>
    <g class="row"><title>health
        loss: 5.5a trillion EUR
        solution: taxes
        gain: 8.8a billion htp
        leverage: 1.6 bn htp per tn EUR</title>
        <circle cx="555.8" cy="329.6" r="8" class="gain"/>
        <text class="lbl" x="543.8" y="329.6" text-anchor="end">health</text>
    </g>
    <g class="row"><title>populism
        loss: 4a trillion EUR
        solution: avoid wrong decisions
        gain: 34.1a billion htp
        leverage: 8.5 bn htp per tn EUR</title>
        <circle cx="423.3" cy="127.2" r="8" class="gain"/>
        <text class="lbl" x="435.3" y="127.2" text-anchor="start">populism</text>
    </g>
    <g class="row"><title>global warming
        loss: 2.2a trillion EUR
        solution: reduce climate gas emissions
        gain: 35.2a billion htp
        leverage: 16.0 bn htp per tn EUR</title>
        <circle cx="264.3" cy="118.4" r="8" class="gain"/>
        <text class="lbl" x="264.3" y="102.4" text-anchor="middle">global warming</text>
    </g>
    <g class="row"><title>poverty
        loss: 2a trillion EUR
        solution: research
        gain: 34.1a billion htp
        leverage: 17.1 bn htp per tn EUR</title>
        <circle cx="246.7" cy="127.2" r="8" class="gain"/>
        <text class="lbl" x="234.7" y="141.2" text-anchor="end">poverty</text>
    </g>
    <g class="row"><title>market power
        loss: 1.6a trillion EUR
        solution: market share tax
        gain: 6a billion htp
        leverage: 3.8 bn htp per tn EUR</title>
        <circle cx="211.3" cy="352.0" r="8" class="gain"/>
        <text class="lbl" x="223.3" y="352.0" text-anchor="start">market power</text>
    </g>
</svg>