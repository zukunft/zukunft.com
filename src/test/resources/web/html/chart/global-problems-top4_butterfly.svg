<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Butterfly chart: potential loss and potential gain per problem">

    <style>
        :root { --bg:#fbfaf7; --fg:#1d1d1b; --muted:#77756f; --grid:#e3e0d8; --loss:#c4561c; --gain:#2d6a8a; --dim:#c9c5bb; --hover:#f4efe6; }
        @media (prefers-color-scheme: dark) {
        :root { --bg:#1b1b1a; --fg:#ecebe6; --muted:#9a978f; --grid:#353431; --loss:#f08a4b; --gain:#5fa6cc; --dim:#55534e; --hover:#262523; }
        }
        svg { font-family: system-ui, sans-serif; }
        .bg { fill: var(--bg); }
        .h { fill: var(--fg); font-size: 18px; font-weight: 600; }
        .sub { fill: var(--muted); font-size: 12px; }
        .grid { stroke: var(--grid); stroke-width: 1; }
        .ax { fill: var(--muted); font-size: 12px; }
        .lbl { fill: var(--fg); font-size: 13px; dominant-baseline: central; }
        .val { fill: var(--muted); font-size: 12px; dominant-baseline: central; }
        .loss { fill: var(--loss); }
        .gain { fill: var(--gain); }
        .hit { fill: transparent; }
        .row:hover .hit { fill: var(--hover); }
    </style>
    <rect class="bg" width="760" height="330"/>
    <text class="h" x="20" y="28">Problem size vs. solution gain</text>
    <text class="sub" x="20" y="47">Assumed values (a) · left: potential loss · right: potential gain · separate scales · hover for details</text>
    <text class="ax" x="300" y="74" text-anchor="end" style="fill:var(--loss);font-weight:600">◀ loss in trillion EUR</text>
    <text class="ax" x="460" y="74" style="fill:var(--gain);font-weight:600">gain in billion htp ▶</text>
    <g class="grid">
        <line x1="216.7" y1="90" x2="216.7" y2="290"/>
        <line x1="133.3" y1="90" x2="133.3" y2="290"/>
        <line x1="50.0" y1="90" x2="50.0" y2="290"/>
        <line x1="525.0" y1="90" x2="525.0" y2="290"/>
        <line x1="590.0" y1="90" x2="590.0" y2="290"/>
        <line x1="655.0" y1="90" x2="655.0" y2="290"/>
        <line x1="720.0" y1="90" x2="720.0" y2="290"/>
        <line x1="300" y1="90" x2="300" y2="290" style="stroke:var(--muted)"/>
        <line x1="460" y1="90" x2="460" y2="290" style="stroke:var(--muted)"/>
    </g>
    <g class="row"><title>health
        loss: 5.5a trillion EUR
        solution: taxes
        gain: 8.8a billion htp
        leverage: 1.6 bn htp per tn EUR</title>
        <rect class="hit" x="0" y="90" width="760" height="40"/>
        <rect class="loss" x="70.8" y="99.0" width="229.2" height="22" rx="3"/>
        <text class="val" x="64.8" y="110.0" text-anchor="end">5.5</text>
        <text class="lbl" x="380.0" y="110.0" text-anchor="middle">health</text>
        <rect class="gain" x="460" y="99.0" width="57.2" height="22" rx="3"/>
        <text class="val" x="523.2" y="110.0">8.8</text>
    </g>
    <g class="row"><title>populism
        loss: 4a trillion EUR
        solution: avoid wrong decisions
        gain: 34.1a billion htp
        leverage: 8.5 bn htp per tn EUR</title>
        <rect class="hit" x="0" y="130" width="760" height="40"/>
        <rect class="loss" x="133.3" y="139.0" width="166.7" height="22" rx="3"/>
        <text class="val" x="127.3" y="150.0" text-anchor="end">4</text>
        <text class="lbl" x="380.0" y="150.0" text-anchor="middle">populism</text>
        <rect class="gain" x="460" y="139.0" width="221.7" height="22" rx="3"/>
        <text class="val" x="687.6" y="150.0">34.1</text>
    </g>
    <g class="row"><title>global warming
        loss: 2.2a trillion EUR
        solution: reduce climate gas emissions
        gain: 35.2a billion htp
        leverage: 16.0 bn htp per tn EUR</title>
        <rect class="hit" x="0" y="170" width="760" height="40"/>
        <rect class="loss" x="208.3" y="179.0" width="91.7" height="22" rx="3"/>
        <text class="val" x="202.3" y="190.0" text-anchor="end">2.2</text>
        <text class="lbl" x="380.0" y="190.0" text-anchor="middle">global warming</text>
        <rect class="gain" x="460" y="179.0" width="228.8" height="22" rx="3"/>
        <text class="val" x="694.8" y="190.0">35.2</text>
    </g>
    <g class="row"><title>poverty
        loss: 2a trillion EUR
        solution: research
        gain: 34.1a billion htp
        leverage: 17.1 bn htp per tn EUR</title>
        <rect class="hit" x="0" y="210" width="760" height="40"/>
        <rect class="loss" x="216.7" y="219.0" width="83.3" height="22" rx="3"/>
        <text class="val" x="210.7" y="230.0" text-anchor="end">2</text>
        <text class="lbl" x="380.0" y="230.0" text-anchor="middle">poverty</text>
        <rect class="gain" x="460" y="219.0" width="221.7" height="22" rx="3"/>
        <text class="val" x="687.6" y="230.0">34.1</text>
    </g>
    <g class="row"><title>market power
        loss: 1.6a trillion EUR
        solution: market share tax
        gain: 6a billion htp
        leverage: 3.8 bn htp per tn EUR</title>
        <rect class="hit" x="0" y="250" width="760" height="40"/>
        <rect class="loss" x="233.3" y="259.0" width="66.7" height="22" rx="3"/>
        <text class="val" x="227.3" y="270.0" text-anchor="end">1.6</text>
        <text class="lbl" x="380.0" y="270.0" text-anchor="middle">market power</text>
        <rect class="gain" x="460" y="259.0" width="39.0" height="22" rx="3"/>
        <text class="val" x="505.0" y="270.0">6</text>
    </g>
    <g class="ax">
        <text x="300.0" y="308" text-anchor="middle">0</text>
        <text x="216.7" y="308" text-anchor="middle">2</text>
        <text x="133.3" y="308" text-anchor="middle">4</text>
        <text x="50.0" y="308" text-anchor="middle">6</text>
        <text x="460.0" y="308" text-anchor="middle">0</text>
        <text x="525.0" y="308" text-anchor="middle">10</text>
        <text x="590.0" y="308" text-anchor="middle">20</text>
        <text x="655.0" y="308" text-anchor="middle">30</text>
        <text x="720.0" y="308" text-anchor="middle">40</text>
    </g>
</svg>