<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Formula Editor - zukunft.com</title>
    <meta name="claude:viewport-fit-sides" content="cover">
    <style>
        /* the formula editor (mock up, see docs/llm/new_view_sample_pv_balance.md step 1) */
        /* layout: a sticky toolbar, then three working columns: the formulas of the page, the */
        /* expression of the selected formula as selectable tokens and the compare list of the */
        /* results until now against the results after the save; the colors are the tokens of */
        /* style/calculator_editor.css so that both editors look the same */
        :root {
            --bg: #eef2f8;
            --surface: #ffffff;
            --surface-2: #f6f8fc;
            --ink: #1b2f5c;
            --ink-2: #4b5d83;
            --muted: #7b88a3;
            --line: #d2dbe9;
            --accent: #385eb7;
            --accent-deep: #274b8f;
            --accent-soft: #dbe4f5;
            --accent-ink: #ffffff;
            --shared: #8a5a07;
            --shared-soft: #fbf0db;
            --danger: #c23b30;
            --danger-soft: #fbe4e1;
            --ok: #2f7d55;
            --ok-soft: #dff1e7;
            --font-ui: "Segoe UI", system-ui, -apple-system, sans-serif;
            --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
            --r: 6px;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #0e1524;
                --surface: #151f33;
                --surface-2: #1a263d;
                --ink: #e3eaf7;
                --ink-2: #b4c1da;
                --muted: #8492ad;
                --line: #2a3a57;
                --accent: #7d9ef0;
                --accent-deep: #a9c0f7;
                --accent-soft: #233761;
                --accent-ink: #0e1524;
                --shared: #e9b45a;
                --shared-soft: #3a2e17;
                --danger: #f08a80;
                --danger-soft: #42221f;
                --ok: #7fd1a3;
                --ok-soft: #1d3a2b;
                color-scheme: dark;
            }
        }

        :root[data-theme="dark"] {
            --bg: #0e1524;
            --surface: #151f33;
            --surface-2: #1a263d;
            --ink: #e3eaf7;
            --ink-2: #b4c1da;
            --muted: #8492ad;
            --line: #2a3a57;
            --accent: #7d9ef0;
            --accent-deep: #a9c0f7;
            --accent-soft: #233761;
            --accent-ink: #0e1524;
            --shared: #e9b45a;
            --shared-soft: #3a2e17;
            --danger: #f08a80;
            --danger-soft: #42221f;
            --ok: #7fd1a3;
            --ok-soft: #1d3a2b;
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        html, body {
            margin: 0;
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font-ui);
            font-size: 14px;
            line-height: 1.45;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0 0 auto;
            height: env(safe-area-inset-top, 0px);
            z-index: 10;
            background: var(--surface);
        }

        button, input, select, textarea {
            font: inherit;
            color: inherit;
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        h2, h3, h4 {
            margin: 0;
            font-weight: 600;
            text-wrap: balance;
        }

        h2 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--muted);
        }

        h3 {
            font-size: 17px;
        }

        h4 {
            font-size: 13px;
            color: var(--ink-2);
        }

        .mono {
            font-family: var(--font-mono);
            font-size: .9em;
        }

        .n {
            font-variant-numeric: tabular-nums;
            text-align: right;
            white-space: nowrap;
        }

        .muted {
            color: var(--muted);
        }

        .note {
            color: var(--muted);
            font-size: 12.5px;
        }

        /* toolbar */
        .bar {
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            z-index: 5;
            background: var(--surface);
            border-bottom: 1px solid var(--line);
            padding-block: 10px;
            padding-left: max(16px, env(safe-area-inset-left, 0px));
            padding-right: max(16px, env(safe-area-inset-right, 0px));
            display: flex;
            flex-wrap: wrap;
            gap: 10px 18px;
            align-items: center;
        }

        .brand {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .brand b {
            font-size: 15px;
            font-weight: 600;
        }

        .brand span {
            font-size: 12px;
            color: var(--muted);
        }

        .tools {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        .tools.right {
            margin-left: auto;
        }

        .btn {
            border: 1px solid var(--line);
            background: var(--surface);
            border-radius: var(--r);
            padding: 6px 11px;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn:hover {
            border-color: var(--accent);
        }

        .btn:disabled {
            opacity: .45;
            cursor: default;
            border-color: var(--line);
        }

        .btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--accent-ink);
        }

        .btn.small {
            padding: 3px 8px;
            font-size: 12.5px;
        }

        .btn.danger {
            color: var(--danger);
        }

        .inp {
            border: 1px solid var(--line);
            background: var(--surface);
            border-radius: var(--r);
            padding: 6px 9px;
            min-width: 0;
            width: 100%;
        }

        .chip {
            display: inline-block;
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 1px 8px;
            font-size: 12px;
            white-space: nowrap;
            background: var(--surface-2);
        }

        .chip.changed {
            background: var(--shared-soft);
            border-color: transparent;
            color: var(--shared);
        }

        .chip.ok {
            background: var(--ok-soft);
            border-color: transparent;
            color: var(--ok);
        }

        .chip.missing {
            background: var(--danger-soft);
            border-color: transparent;
            color: var(--danger);
        }

        .chip.same {
            color: var(--muted);
        }

        /* columns */
        .cols {
            display: grid;
            grid-template-columns: 290px minmax(0, 1fr) minmax(0, 1.15fr);
            gap: 14px;
            padding-block: 14px;
            padding-left: max(16px, env(safe-area-inset-left, 0px));
            padding-right: max(16px, env(safe-area-inset-right, 0px));
            align-items: start;
        }

        @media (max-width: 1150px) {
            .cols {
                grid-template-columns: 260px minmax(0, 1fr);
            }

            .col.compare {
                grid-column: 1 / -1;
            }
        }

        @media (max-width: 760px) {
            .cols {
                grid-template-columns: minmax(0, 1fr);
            }

            .col.compare {
                grid-column: auto;
            }
        }

        .col {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 10px;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 14px;
        }

        .col-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        /* formula list */
        .flist {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 70vh;
            overflow: auto;
        }

        .flist li {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 7px 9px;
            border-radius: var(--r);
            cursor: pointer;
            border: 1px solid transparent;
        }

        .flist li:hover {
            background: var(--surface-2);
        }

        .flist li.sel {
            background: var(--accent-soft);
            border-color: var(--accent);
        }

        .flist .fname {
            display: flex;
            justify-content: space-between;
            gap: 6px;
            align-items: baseline;
        }

        .flist .fexp {
            color: var(--ink-2);
            font-family: var(--font-mono);
            font-size: 11.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* the expression as tokens */
        .expr {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: var(--r);
            background: var(--surface-2);
            min-height: 48px;
        }

        .tok {
            border: 1px solid var(--line);
            border-radius: var(--r);
            background: var(--surface);
            padding: 4px 8px;
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: 13px;
            line-height: 1.3;
        }

        .tok.phr {
            background: var(--accent-soft);
            border-color: transparent;
            color: var(--accent-deep);
            font-family: var(--font-ui);
            font-size: 13.5px;
        }

        .tok.phr .sep {
            color: var(--muted);
            margin: 0 2px;
        }

        .tok.eq, .tok.op, .tok.br {
            font-weight: 600;
        }

        .tok.eq {
            cursor: default;
            border-color: transparent;
            background: transparent;
        }

        .tok.sel {
            box-shadow: 0 0 0 2px var(--accent);
        }

        .tok.add {
            border-style: dashed;
            color: var(--muted);
            background: transparent;
        }

        .tok.add:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        .tok.unknown {
            background: var(--danger-soft);
            color: var(--danger);
        }

        textarea.inp {
            font-family: var(--font-mono);
            font-size: 13px;
            resize: vertical;
            min-height: 52px;
        }

        .err {
            color: var(--danger);
            font-size: 12.5px;
        }

        /* token tools and the phrase picker */
        .box {
            border: 1px solid var(--line);
            border-radius: var(--r);
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .box-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        .names {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .name {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            border-radius: 999px;
            border: 1px solid var(--line);
            padding: 2px 4px 2px 10px;
            cursor: pointer;
        }

        .name.sel {
            background: var(--accent-soft);
            border-color: var(--accent);
        }

        .name .x {
            border: 0;
            background: transparent;
            cursor: pointer;
            color: var(--muted);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            line-height: 1;
        }

        .name .x:hover {
            color: var(--danger);
        }

        .plist {
            list-style: none;
            margin: 0;
            padding: 0;
            max-height: 260px;
            overflow: auto;
            border: 1px solid var(--line);
            border-radius: var(--r);
        }

        .plist li {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            padding: 5px 9px;
            cursor: pointer;
            border-bottom: 1px solid var(--line);
        }

        .plist li:last-child {
            border-bottom: 0;
        }

        .plist li:hover {
            background: var(--surface-2);
        }

        .plist li.cur {
            background: var(--accent-soft);
        }

        .plist .pdesc {
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 50%;
        }

        /* compare list */
        .summary {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        .tabs {
            display: flex;
            gap: 4px;
            border-bottom: 1px solid var(--line);
        }

        .tab {
            border: 0;
            background: transparent;
            padding: 6px 10px;
            cursor: pointer;
            color: var(--muted);
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
        }

        .tab.on {
            color: var(--accent);
            border-bottom-color: var(--accent);
            font-weight: 600;
        }

        .twrap {
            overflow-x: auto;
        }

        table.cmp {
            border-collapse: collapse;
            width: 100%;
            font-size: 13px;
        }

        table.cmp th {
            text-align: left;
            font-size: 11.5px;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: var(--muted);
            font-weight: 600;
            padding: 4px 6px;
            border-bottom: 1px solid var(--line);
        }

        table.cmp th.n {
            text-align: right;
        }

        table.cmp td {
            padding: 5px 6px;
            border-bottom: 1px solid var(--line);
            vertical-align: top;
        }

        table.cmp tr.grp td {
            background: var(--surface-2);
            font-weight: 600;
            padding-top: 8px;
        }

        table.cmp tr.res {
            cursor: pointer;
        }

        table.cmp tr.res:hover td {
            background: var(--surface-2);
        }

        table.cmp tr.res.open td {
            border-bottom: 0;
        }

        table.cmp td.new.changed {
            color: var(--shared);
            font-weight: 600;
        }

        table.cmp td.new.missing {
            color: var(--danger);
        }

        table.cmp tr.det td {
            padding-top: 0;
        }

        .wds {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
        }

        .wd {
            border-radius: 4px;
            padding: 0 5px;
            background: var(--surface-2);
            border: 1px solid var(--line);
            font-size: 12px;
        }

        .wd.page {
            color: var(--muted);
            border-style: dashed;
        }

        .wd.res {
            background: var(--accent-soft);
            border-color: transparent;
            color: var(--accent-deep);
            font-weight: 600;
        }

        table.ops {
            border-collapse: collapse;
            width: 100%;
            font-size: 12.5px;
            background: var(--surface-2);
            border-radius: var(--r);
        }

        table.ops td {
            padding: 3px 6px;
            border-bottom: 1px solid var(--line);
        }

        table.ops tr:last-child td {
            border-bottom: 0;
        }

        .delta {
            font-size: 11.5px;
            color: var(--muted);
        }

        /* changes */
        pre.json {
            margin: 0;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: var(--r);
            background: var(--surface-2);
            font-family: var(--font-mono);
            font-size: 12px;
            overflow: auto;
            max-height: 50vh;
            white-space: pre;
        }

        .diff {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr);
            gap: 2px 10px;
            font-size: 13px;
        }

        .diff .k {
            color: var(--muted);
        }

        .diff .old {
            text-decoration: line-through;
            color: var(--muted);
        }

        /* toast */
        .toast {
            position: fixed;
            left: 50%;
            bottom: calc(18px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            background: var(--ink);
            color: var(--bg);
            padding: 8px 14px;
            border-radius: var(--r);
            z-index: 20;
            max-width: 90vw;
        }

        @media (prefers-reduced-motion: no-preference) {
            .toast {
                transition: opacity .3s;
            }
        }
    </style>
</head>
<body>
<header class="bar">
    <div class="brand">
        <b>Formula editor</b>
        <span id="pageName">page</span>
    </div>
    <form class="tools" id="pageForm">
        <label for="pageIn" class="note">Phrase</label>
        <input class="inp" id="pageIn" type="text" placeholder="another page phrase" style="width: 200px;">
        <button class="btn" type="submit">Load</button>
    </form>
    <div class="tools right">
        <span class="chip" id="changeCount">no changes</span>
        <button class="btn" id="btnResetAll" type="button" disabled>Discard all</button>
        <button class="btn primary" id="btnSave" type="button" disabled>Save</button>
    </div>
</header>

<main class="cols">
    <section class="col formulas" aria-label="Formulas">
        <div class="col-head">
            <h2>Formulas of the page</h2>
            <span class="note" id="formulaCount"></span>
        </div>
        <input class="inp" id="formulaFilter" type="search" placeholder="filter by name or phrase">
        <ul class="flist" id="formulaList"></ul>
    </section>

    <section class="col editor" aria-label="Formula" id="editor"></section>

    <section class="col compare" aria-label="Results">
        <div class="tabs" role="tablist">
            <button class="tab on" type="button" data-tab="compare" role="tab">Results until now vs. after save</button>
            <button class="tab" type="button" data-tab="changes" role="tab">Changes</button>
        </div>
        <div id="compare"></div>
        <div id="changes" hidden></div>
    </section>
</main>

<div class="toast" id="toast" hidden></div>

olumn consumption mix","verb":"with","to":"gram per kWh","description":"the column shows the mix in gram per kWh and not the net avoided emission or the battery effect, which name the consumption mix too"},{"name":"kilowatthours per year","from":"kWh","verb":"per","to":"year","description":"the unit of an annual electricity amount e.g. the household consumption"},{"from":"kWh/a","verb":"is symbol for","to":"kilowatthours per year"},{"name":"kilowatthours per kilowatt peak and year","from":"kWh per kWp","verb":"per","to":"year","description":"the unit of the specific yield of a PV system, the annual electricity per kWp of rated power"},{"from":"kWh/kWp·a","verb":"is symbol for","to":"kilowatthours per kilowatt peak and year"},{"name":"year (duration unit)","from":"year","verb":"must be one of","to":"duration unit","description":"the year as the unit of a duration e.g. the lifetime of a PV system or the payback time, in contrast to a year as a period of time"},{"from":"a","verb":"is symbol for","to":"year (duration unit)"},{"name":"share (ratio)","from":"share","verb":"must be one of","to":"ratio","description":"a part of a whole as the ratio from 0 to 1 e.g. the day share of the consumption or the efficiency of the battery, stored like a percent"},{"from":"share","verb":"is symbol for","to":"share (ratio)"},{"from":"g/kWh","verb":"is symbol for","to":"gram per kWh"},{"from":"kg/kWh","verb":"is symbol for","to":"kg per kWh"},{"name":"field limit up","from":"process catch field (system)","verb":"has a","to":"maximum"},{"name":"consumption mix input year","from":"consumption mix","verb":"has a","to":"2018","description":"the Swiss consumption mix of the page is the annual mix of 2018 and not the monthly mix or the avoided emission of another use case"},{"name":"consumption mix field value phrase","from":"consumption mix input year","verb":"can be","to":"field value phrases"},{"name":"PV in Switzerland input year","from":"PV in Switzerland","verb":"has a","to":"2023","description":"the life cycle emission of the page is the 2023 update and not the 2018 figure of KBOB"},{"name":"PV in Switzerland field value phrase","from":"PV in Switzerland input year","verb":"can be","to":"field value phrases"},{"name":"production mix order","from":"production mix","verb":"is follower of","to":"residual mix","description":"the residual mix is the first option of the replacement mix selector"},{"name":"PV installation assumption PV yield hint","from":"PV installation assumption PV yield","verb":"has a","to":"calculator hint","description":"Lifetime average incl. 0.7 %/a degradation"},{"name":"PV installation assumption lifetime hint","from":"PV installation assumption lifetime","verb":"has a","to":"calculator hint","description":"Reference lifetime used in the LCA"},{"name":"PV installation assumption PV in Switzerland hint","from":"PV installation assumption PV in Switzerland","verb":"has a","to":"calculator hint","description":"Swiss 3 kWp mono-Si pitched roof, 2023 update; converted to a fixed amount per kWp"},{"name":"PV installation assumption consumption mix hint","from":"PV installation assumption consumption mix","verb":"has a","to":"calculator hint","description":"2018 consumer mix, low voltage"},{"name":"PV installation assumption day share hint","from":"PV installation assumption day share","verb":"has a","to":"calculator hint","description":"Household; raise for home office or a heat pump running at noon"},{"name":"PV installation assumption battery production emission hint","from":"PV installation assumption battery production emission","verb":"has a","to":"calculator hint","description":"Literature spans ~37–212 kg CO₂-eq per kWh capacity"}],"formulas":[{"id":161,"name":"PV production by orientation","description":"the annual PV production: the rated power times the specific yield of the best orientation times the yield factor of the real orientation","expression":"\"PV production\" = \"PV capacity\" * \"PV yield\" * \"yield factor\""},{"id":162,"name":"battery discharge formula","description":"what the battery gives back: the charge times the round-trip efficiency","expression":"\"battery discharge\" = \"battery charge\" * \"round-trip efficiency\""},{"id":163,"name":"export formula","description":"the PV production that is neither used directly nor stored goes to the grid","expression":"\"export\" = \"PV production\" - \"direct use\" - \"battery charge\""},{"id":164,"name":"grid import formula","description":"the consumption not covered by direct use and battery discharge is bought from the grid","expression":"\"grid import\" = \"household consumption\" - \"direct use\" - \"battery discharge\""},{"id":165,"name":"delivered electricity formula","description":"the PV electricity that reaches a consumer, so the production minus the battery losses","expression":"\"delivered electricity\" = \"direct use\" + \"battery discharge\" + \"export\""},{"id":166,"name":"self-consumption share by dispatch","description":"the share of the production used on site; the battery charge counts in full, because the losses happen on site too. The self-consumption model has a monthly resolution: the direct use is capped at the load during the PV hours, the battery does at most one full cycle per day and only covers the evening and night load. Real day-to-day weather swings lower the battery share somewhat. The monthly PV and load profiles are assumed typical values for the Zurich region (confidence 0.6)","expression":"\"self-consumption share\" = ( \"direct use\" + \"battery charge\" ) / \"PV production\""},{"id":167,"name":"autarky formula","description":"the share of the household consumption covered by the own PV electricity","expression":"\"autarky\" = ( \"direct use\" + \"battery discharge\" ) / \"household consumption\""},{"id":168,"name":"PV embodied intensity formula","description":"turns the life cycle emission per kWh of the reference system into a fixed amount per kWp: the emission per kWh is spread over the reference yield and lifetime, so a site with a lower yield has the same embodied emission and a higher emission per kWh; the division by 1000 converts gram to kg","expression":"\"PV embodied intensity\" = \"PV in Switzerland\" * \"PV yield\" * \"lifetime\" / 1000"},{"id":169,"name":"PV embodied emission formula","description":"","expression":"\"PV embodied emission\" = \"PV embodied intensity\" * \"PV capacity\""},{"id":170,"name":"battery embodied emission formula","description":"the production emission of all batteries bought over the lifetime","expression":"\"battery embodied emission\" = \"battery capacity\" * \"battery production emission\" * \"battery count\""},{"id":171,"name":"gross avoided emission by consumption mix","description":"the emission of the Swiss consumption mix that the delivered PV electricity displaces over the lifetime; one formula per reference mix, because the mix is the operand; the division by 1000 converts gram to kg","expression":"\"gross avoided emission\" = \"delivered electricity\",\"lifetime\" * \"consumption mix\" / 1000"},{"id":172,"name":"gross avoided emission by PV-weighted consumption mix","description":"the same with the Swiss consumption mix weighted by the monthly PV delivery: PV produces mostly in summer, when the Swiss consumption mix is cleanest (about 70 to 90 g/kWh in May to August, 140 to 165 g/kWh in winter), so weighting the PV output of each month by the mix of that month gives a lower saving than the annual average","expression":"\"gross avoided emission\" = \"delivered electricity\",\"lifetime\" * \"PV-weighted consumption mix\" / 1000"},{"id":173,"name":"gross avoided emission by residual mix","description":"the same with the European residual mix as the replacement mix","expression":"\"gross avoided emission\" = \"delivered electricity\",\"lifetime\" * \"residual mix\" / 1000"},{"id":174,"name":"net avoided emission formula","description":"the gross avoided emission minus the embodied emission of the PV system and the battery; the reference mix is selected by the context. Every PV kilowatt-hour that reaches a consumer, used at home or exported, is assumed to displace one kilowatt-hour of grid electricity, the production emissions of the modules and the battery are subtracted, and the battery losses reduce the delivered energy","expression":"\"net avoided emission\" = \"gross avoided emission\" - \"PV embodied emission\" - \"battery embodied emission\""},{"id":175,"name":"emission payback formula","description":"the operating years until the gross avoided emission equals the embodied emission, assuming an even avoided emission per year","expression":"\"emission payback\" = ( \"PV embodied emission\" + \"battery embodied emission\" ) / \"gross avoided emission\" * \"lifetime\""},{"id":176,"name":"lifetime total formula","description":"the total of an annual number over the lifetime of the installation, e.g. the PV production or the export; the result carries the lifetime word in place of the annual word of the input, and the years are the lifetime of the PV installation","expression":"\"lifetime\" = \"annual\" * \"year (duration unit)\""},{"id":177,"name":"annual share formula","description":"the share of one year of a CO2-eq total over the lifetime, e.g. the embodied emission of the PV system or the net avoided emission; the result carries the annual word, and the years are the lifetime of the PV installation","expression":"\"annual\" = \"CO2-eq\" / \"year (duration unit)\""},{"id":178,"name":"battery losses formula","description":"the battery losses: the charge minus what the battery gives back","expression":"\"battery losses\" = \"battery charge\" - \"battery discharge\""},{"id":179,"name":"battery effect formula","description":"the effect of the battery on the net avoided emission against the same PV installation without battery, which delivers all its production: the lifetime battery losses do not displace the reference mix and the battery production adds its embodied emission; the division by 1000 converts gram to kg","expression":"\"battery effect\" = 0 - \"battery losses\",\"lifetime\" * \"consumption mix\" / 1000 - \"battery embodied emission\""},{"id":180,"name":"PV site intensity formula","description":"the embodied emission of the PV system divided by the lifetime production at this site; the multiplication by 1000 converts kg to gram","expression":"\"PV site intensity\" = \"PV embodied emission\" * 1000 / \"PV production\",\"lifetime\""},{"id":181,"name":"gross avoided emission by production mix","description":"the same with the European production mix as the replacement mix","expression":"\"gross avoided emission\" = \"delivered electricity\",\"lifetime\" * \"production mix\" / 1000"},{"id":182,"name":"annual consumption mix by PV weighting","description":"the consumption mix of a year as the PV installation uses it: the PV-weighted consumption mix, so that the year row of the monthly table shows the mix that the twelve monthly mixes give with the PV delivery as the weight","expression":"\"consumption mix\",\"annual\" = \"PV-weighted consumption mix\""}],"sources":[{"name":"IEA PVPS Task 12 fact sheet 2023","url":"https://iea-pvps.org/wp-content/uploads/2024/09/Task-12-Fact-Sheet-Stucki.pdf"},{"name":"KBOB energy systems 2022","url":"https://www.ecobau.ch/resources/uploads/Oekobilanzdaten/Hintergrundberichte/KBOB_BAFU_AHB_2022_Energiesysteme_v1_0.pdf"},{"name":"treeze monthly electricity mixes 2025","url":"https://www.stadt-zuerich.ch/content/dam/web/de/aktuell/publikationen/2025/studien-netto-null/oekobilanz-monatliche-strombereitstellung-studie.pdf"},{"name":"Swissolar PV fact sheet 2024","url":"https://www.swissolar.ch/01_wissen/swissolar-publikationen/branchen-faktenblatt_pv_ch_f.pdf"},{"name":"Lithium-ion cell LCA comparison 2025","url":"https://ideas.repec.org/a/bla/inecol/v29y2025i1p113-128.html"},{"name":"HTW Berlin solar storage climate 2019","url":"https://solar.htw-berlin.de/wp-content/uploads/WENIGER-2019                 }
