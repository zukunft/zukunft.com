<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <title>Politische Ausrichtung und inneres Wohlbefinden: Selbstbericht gegen Verhaltensmass</title>
    <desc>Schematisches Liniendiagramm. Die horizontale Achse zeigt die politische Ausrichtung von links nach rechts, die vertikale Achse ein Index des inneren Wohlbefindens. Die durchgezogene Linie, selbstberichtete Zufriedenheit, steigt von links nach rechts an. Die gestrichelte Linie, verhaltensbasiert gemessene Zufriedenheit, faellt von links nach rechts ab. Beide Kurven schneiden sich in der Mitte. Die Werte sind schematisch und stellen die Richtung der Befunde dar, nicht gemessene Groessen.</desc>

    <text x="40" y="34" font-size="16" font-weight="500" fill="#3d3d3a">Politische Ausrichtung und inneres Wohlbefinden</text>
    <text x="40" y="54" font-size="12" fill="#73726c">schematisch: Richtung der Befunde, keine gemessenen Werte</text>

    <line x1="90" y1="330" x2="620" y2="330" stroke="#c3c2b7" stroke-width="1"/>
    <line x1="90" y1="265" x2="620" y2="265" stroke="#e1e0d9" stroke-width="1"/>
    <line x1="90" y1="200" x2="620" y2="200" stroke="#e1e0d9" stroke-width="1"/>
    <line x1="90" y1="135" x2="620" y2="135" stroke="#e1e0d9" stroke-width="1"/>
    <line x1="90" y1="70" x2="620" y2="70" stroke="#e1e0d9" stroke-width="1"/>
    <line x1="90" y1="70" x2="90" y2="330" stroke="#c3c2b7" stroke-width="1"/>

    <text x="80" y="334" font-size="11" fill="#898781" text-anchor="end">30</text>
    <text x="80" y="269" font-size="11" fill="#898781" text-anchor="end">40</text>
    <text x="80" y="204" font-size="11" fill="#898781" text-anchor="end">50</text>
    <text x="80" y="139" font-size="11" fill="#898781" text-anchor="end">60</text>
    <text x="80" y="74" font-size="11" fill="#898781" text-anchor="end">70</text>

    <text x="90" y="352" font-size="12" fill="#73726c" text-anchor="middle">links</text>
    <text x="222" y="352" font-size="12" fill="#73726c" text-anchor="middle">Mitte-links</text>
    <text x="355" y="352" font-size="12" fill="#73726c" text-anchor="middle">Mitte</text>
    <text x="488" y="352" font-size="12" fill="#73726c" text-anchor="middle">Mitte-rechts</text>
    <text x="620" y="352" font-size="12" fill="#73726c" text-anchor="middle">rechts</text>
    <text x="355" y="378" font-size="12" fill="#898781" text-anchor="middle">politische Ausrichtung</text>

    <polyline points="90,265 222,232 355,200 488,161 620,135" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="90" cy="265" r="4" fill="#2a78d6"/>
    <circle cx="222" cy="232" r="4" fill="#2a78d6"/>
    <circle cx="355" cy="200" r="4" fill="#2a78d6"/>
    <circle cx="488" cy="161" r="4" fill="#2a78d6"/>
    <circle cx="620" cy="135" r="4" fill="#2a78d6"/>

    <polyline points="90,135 222,161 355,200 488,232 620,258" fill="none" stroke="#eb6834" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="86" y="131" width="8" height="8" fill="#eb6834" transform="rotate(45 90 135)"/>
    <rect x="218" y="157" width="8" height="8" fill="#eb6834" transform="rotate(45 222 161)"/>
    <rect x="351" y="196" width="8" height="8" fill="#eb6834" transform="rotate(45 355 200)"/>
    <rect x="484" y="228" width="8" height="8" fill="#eb6834" transform="rotate(45 488 232)"/>
    <rect x="616" y="254" width="8" height="8" fill="#eb6834" transform="rotate(45 620 258)"/>

    <rect x="90" y="396" width="10" height="10" rx="2" fill="#2a78d6"/>
    <text x="108" y="405" font-size="12" fill="#52514e">Selbstbericht (Lebenszufriedenheit, GSS und Wojcik Studie 1)</text>
    <rect x="90" y="416" width="10" height="10" rx="2" fill="#eb6834"/>
    <text x="108" y="425" font-size="12" fill="#52514e">Verhaltensmass (Emotionswortgebrauch und Laecheln, Wojcik Studien 2 bis 4)</text>

    <text x="40" y="250" font-size="12" fill="#898781" text-anchor="middle" transform="rotate(-90 40 250)">inneres Wohlbefinden (Index)</text>
</svg>