<VirtualHost *:80>
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        # no directory listing: the docroot contains the whole repo, so a listing
        # would expose the source tree even where a download is blocked
        Options -Indexes +FollowSymLinks
        # the root .htaccess adds the file type based download blocks
        AllowOverride All
        Require all granted
    </Directory>

    # never serve the version control history or any dot file (e.g. .env, .htaccess),
    # enforced in the vhost so a broken or missing .htaccess cannot expose them
    <DirectoryMatch "/\.git">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
</VirtualHost>
